version: 2
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X xn--gckvb8fzb.com/zeit/runtime.Version={{.Version}}
      - -X xn--gckvb8fzb.com/zeit/runtime.Commit={{.Commit}}
      - -X xn--gckvb8fzb.com/zeit/runtime.Date={{.Date}}
    goos:
      - darwin
      - dragonfly
      - freebsd
      - illumos
      - linux
      - netbsd
      - openbsd
      - plan9
      - solaris
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
      - mips
      - mips64
      - mips64le
      - mipsle
      - ppc64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - "6"
      - "7"
changelog:
  use: github
  format: "{{.SHA}}: {{.Message}} (@{{.AuthorUsername}})"
  sort: asc
  abbrev: -1
